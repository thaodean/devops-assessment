stages:
  - lint
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: myapp
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

helm-lint:
  stage: lint
  image: alpine/helm:latest
  script:
    - helm lint ./helm

terraform-fmt:
  stage: lint
  image: hashicorp/terraform:light
  script:
    - terraform fmt -check ./terraform

build:
  stage: build
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${IMAGE_TAG} -f Dockerfile .
    - docker push ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}

test:
  stage: test
  script:
    - docker run -d --name test-app -p 8080:8080 -e ENVIRONMENT=test ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}
    - sleep 3
    - curl -f http://localhost:8080/health || exit 1
    - curl -f http://localhost:8080/version || exit 1
    - docker stop test-app && docker rm test-app

deploy:
  stage: deploy
  script:
    - cd terraform
    - terraform init
    - terraform apply -auto-approve -var="image_tag=${IMAGE_TAG}" -var="environment=prod"
  only:
    - main
